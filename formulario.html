<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - Batalha de Rima</title>
    <link rel="icon" href="https://i.pinimg.com/736x/83/2e/6e/832e6ebb1f40a888464c2da70fa6af69.jpg" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fefae0] text-zinc-800 font-sans min-h-screen flex flex-col justify-between selection:bg-purple-600 selection:text-white">

    <header class="bg-[#7209b7] text-white px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4 shadow-md sticky top-0 z-50">
        <h1 class="text-2xl font-bold tracking-wider">
            <a href="index.html" class="hover:text-purple-200 transition">Batalha de Rima</a>
        </h1>
        <nav>
            <ul class="flex flex-wrap justify-center gap-6 text-sm font-semibold">
                <li><a href="index.html" class="hover:text-purple-200 transition">Início</a></li>
                <li><a href="sobre.html" class="hover:text-purple-200 transition">Sobre</a></li>
                <li><a href="local.html" class="hover:text-purple-200 transition">Local</a></li>
                <li><a href="participar.html" class="text-purple-200 underline">Como Participar</a></li>
                <li><a href="contato.html" class="hover:text-purple-200 transition">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main class="max-w-xl mx-auto px-6 py-12 w-full my-auto">
        <form id="contact-form" class="bg-white border border-purple-200 p-8 rounded-2xl shadow-lg space-y-6">
            <h1 class="text-3xl font-extrabold text-[#7209b7] text-center">Inscrição para Batalha</h1>
            
            <div class="space-y-4">
                <div class="flex flex-col space-y-1">
                    <label for="name" class="font-semibold text-sm text-zinc-700">Nome:</label>
                    <input type="text" id="name" name="name" placeholder="Digite seu nome" required class="border border-purple-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#7209b7]">
                </div>

                <div class="flex flex-col space-y-1">
                    <label for="age" class="font-semibold text-sm text-zinc-700">Idade:</label>
                    <input type="number" id="age" name="age" placeholder="Digite sua idade" required class="border border-purple-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#7209b7]">
                </div>

                <div class="flex flex-col space-y-1">
                    <label for="city" class="font-semibold text-sm text-zinc-700">Cidade:</label>
                    <input type="text" id="city" name="city" placeholder="Digite sua cidade" class="border border-purple-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#7209b7]">
                </div>

                <div class="flex flex-col space-y-1">
                    <label for="experience" class="font-semibold text-sm text-zinc-700">Experiência anterior em batalhas:</label>
                    <textarea id="experience" name="experience" placeholder="Descreva ou escreva 'Nenhuma'" rows="3" class="border border-purple-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#7209b7]"></textarea>
                </div>

                <div class="flex flex-col space-y-1">
                    <label for="motivation" class="font-semibold text-sm text-zinc-700">Por que você quer participar?</label>
                    <textarea id="motivation" name="motivation" placeholder="Explique sua motivação" rows="3" class="border border-purple-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#7209b7]"></textarea>
                </div>

                <div class="flex flex-col space-y-1">
                    <label for="contact" class="font-semibold text-sm text-zinc-700">Contato (e-mail ou telefone):</label>
                    <input type="text" id="contact" name="contact" placeholder="Digite seu e-mail ou telefone" class="border border-purple-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#7209b7]">
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-[#7209b7] hover:bg-purple-800 text-white font-bold py-3 rounded-xl transition shadow-md shadow-purple-500/20">Enviar Inscrição</button>
                </div>
            </div>
        </form>
        <p class="text-center text-xs text-zinc-600 mt-4">Após preencher, aguarde a confirmação. Boa sorte nas rimas!</p>
    </main>

    <footer class="bg-[#7209b7] text-white py-6 text-center text-sm shadow-inner">
        <p>&copy; 2026 Batalha de Rima. Todos os direitos reservados.</p>
    </footer>
</body>
</html>

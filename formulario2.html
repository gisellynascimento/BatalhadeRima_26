<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entre em Contato - Batalha de Rima</title>
    <link rel="icon" href="https://i.pinimg.com/736x/83/2e/6e/832e6ebb1f40a888464c2da70fa6af69.jpg" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fefae0] text-zinc-800 font-sans min-h-screen flex flex-col justify-between selection:bg-purple-600 selection:text-white">

    <header class="bg-[#7209b7] text-white px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4 shadow-md sticky top-0 z-50">
        <h1 class="text-2xl font-bold tracking-wider">
            <a href="index.html" class="hover:text-purple-200 transition">Batalha de Rima</a>
        </h1>
        <nav>
            <ul class="flex flex-wrap justify-center gap-6 text-sm font-semibold">
                <li><a href="index.html" class="hover:text-purple-200 transition">Início</a></li>
                <li><a href="sobre.html" class="hover:text-purple-200 transition">Sobre</a></li>
                <li><a href="local.html" class="hover:text-purple-200 transition">Local</a></li>
                <li><a href="participar.html" class="hover:text-purple-200 transition">Como Participar</a></li>
                <li><a href="contato.html" class="text-purple-200 underline">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main class="max-w-xl mx-auto px-6 py-12 w-full my-auto">
        <form id="contact-form" class="bg-white border border-purple-200 p-8 rounded-2xl shadow-lg space-y-6">
            <h1 class="text-3xl font-extrabold text-[#7209b7] text-center">Entre em Contato</h1>
            
            <div class="space-y-4">
                <div class="flex flex-col space-y-1">
                    <label for="contact-name" class="font-semibold text-sm text-zinc-700">Nome:</label>
                    <input type="text" id="contact-name" name="contact-name" placeholder="Seu nome completo" required class="border border-purple-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#7209b7]">
                </div>
                
                <div class="flex flex-col space-y-1">
                    <label for="contact-email" class="font-semibold text-sm text-zinc-700">E-mail:</label>
                    <input type="email" id="contact-email" name="contact-email" placeholder="Seu melhor e-mail" required class="border border-purple-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#7209b7]">
                </div>
                
                <div class="flex flex-col space-y-1">
                    <label for="contact-message" class="font-semibold text-sm text-zinc-700">Mensagem:</label>
                    <textarea id="contact-message" name="contact-message" rows="4" placeholder="Escreva sua mensagem aqui..." required class="border border-purple-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#7209b7]"></textarea>
                </div>
                
                <div class="pt-2">
                    <button type="submit" class="w-full bg-[#7209b7] hover:bg-purple-800 text-white font-bold py-3 rounded-xl transition shadow-md shadow-purple-500/20">Enviar Mensagem</button>
                </div>
            </div>
        </form>
    </main>

    <footer class="bg-[#7209b7] text-white py-6 text-center text-sm shadow-inner">
        <p>&copy; 2026 Batalha de Rima. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
